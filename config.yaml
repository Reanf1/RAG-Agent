# 页面读取 app、importing 和 paths.raw_documents；分块/向量化入口读取 chunking/embedding。
app:
  name: 智能科研助理
  description: 基于 RAG + Agent 的论文知识库问答系统

# 单份上传文件大小参考上游 20 MB 限制。
importing:
  max_file_size_mb: 20

# 默认本地推理；页面启动不要求安装或连接模型。
llm:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen2.5:7b
  # 八组真实生成对照后保留低温起点；完整记录见 docs/QA/5.2.1 Prompt与生成策略.md。
  temperature: 0.1
  top_p: 0.9
  # 生成候选词数，不是 retrieval.top_k 的文档数；实测选型见生成参数 QA。
  top_k: 40
  # Windows 8GB显存实测16K可保留多步证据；低显存可改回8192，输出/历史预算不变。
  num_ctx: 16384
  num_predict: 512
  repeat_penalty: 1.0

# 先按字符／句界挑选证据；发送前用本地Qwen词表核对完整请求并预留输出Token。
generation:
  low_relevance_threshold: 0.1  # 仅用于 BGE sigmoid 重排分数；低于此值先确认，不代表命中概率。
  max_context_chars: 6000
  # 包含系统规范、用户问题、来源标记和分隔符，不包含模型回答。
  max_prompt_chars: 12000
  # 只复用同知识库/配置且校验通过的答案；保守阈值依据见语义缓存 QA。
  cache:
    similarity_threshold: 0.97
    max_entries: 100

# 人工智能论文中英双语基准比较后保留 M3E；跨语言质量限制见 docs/QA。
# Embedding 使用本地模型文件；模型名和 revision 用于权重准备与实验溯源。
embedding:
  model: moka-ai/m3e-base
  revision: 764b537a0e50e5c7d64db883f2d2e051cbe3c64c
  local_path: data/models/m3e-base
  device: cpu
  batch_size: 32
retrieval:
  vector_store: chroma
  collection_name: paper_chunks
  # 双语论文基准中默认 search_ef=10 召回不足；100 已通过精确排名对照。
  search_ef: 100
  index_threads: 4
  top_k: 5
  # 两路各取足够候选后做 RRF；模型重排对融合后的 Top-20 精排。
  candidate_k: 20
  rrf_k: 60
  reranker_model: BAAI/bge-reranker-base
  reranker_revision: 2cfc18c9415c912f9d8155881c133215df768a70
  reranker_local_path: data/models/bge-reranker-base
  reranker_device: cpu
  reranker_batch_size: 8
  # 问题与正文合计的 Token 上限；不等同于分块的字符数。
  reranker_max_length: 512
chunking:
  # fixed / recursive / semantic；大小和重叠均以字符计，表格整块保留。
  # 固定切分实验比较 256/512/1024；递归和句段策略使用以下默认参数。
  strategy: recursive
  chunk_size: 512
  chunk_overlap: 64
agent:
  max_iterations: 8
  max_parallel_calls: 2  # 同轮独立调用/线程上限，本地模型服务仍可能排队。
  tool_timeout_seconds: 300  # 单次逻辑调用的总等待预算，包含重试。
  max_tool_retries: 1  # 只重试已结束的超时异常，不重试仍在运行的函数。
  max_repeated_calls: 2  # 同一请求中，相同工具和参数最多执行两轮。
  online_search_enabled: false
memory:
  max_history_tokens: 2000  # 限制送入Agent的摘要+历史窗口，SQLite原始记录保留。
  tokenizer_path: data/models/qwen2.5-tokenizer/tokenizer.json
  summary_trigger_turns: 10  # 未压缩历史累计达到此轮数时，阶段性更新摘要。
  summary_keep_recent_turns: 4  # 保留最近完整问答；总Token预算仍优先。
  summary_max_tokens: 400  # 摘要JSON字段的Token上限，超限拒绝入库。
paths:
  raw_documents: data/raw
  vector_index: data/index
  logs: logs
  session_db: data/sessions/memory.sqlite3
